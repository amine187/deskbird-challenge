version: '3.8'

services:
  database:
    image: postgres:16
    container_name: user_db
    env_file: .env
    restart: unless-stopped
    networks:
      - app-backend-tier
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: user_api
    env_file: .env
    restart: unless-stopped
    networks:
      - app-backend-tier
    ports:
      - '3000:3000'
    depends_on:
      - database

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file: .env
    ports:
      - '5050:80'
    networks:
      - app-backend-tier
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - database

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  app-backend-tier:
    driver: bridge
